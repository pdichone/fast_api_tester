<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice SOAP Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .main-content {
            padding: 30px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Dashboard View */
        .patient-list {
            margin-top: 20px;
        }

        .patient-card {
            background: #f7f9fc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .patient-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .patient-name {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
        }

        .patient-date {
            font-size: 14px;
            color: #718096;
            margin-top: 5px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-back {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Recording View */
        .recording-container {
            text-align: center;
            padding: 40px 20px;
        }

        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .record-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .record-btn.recording {
            background: #e53e3e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.7);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(229, 62, 62, 0);
            }
        }

        .status-text {
            font-size: 18px;
            color: #4a5568;
            margin-top: 20px;
        }

        .timer {
            font-size: 48px;
            font-weight: 700;
            color: #2d3748;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        /* SOAP Note View */
        .soap-section {
            margin-bottom: 25px;
        }

        .soap-section h3 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .soap-content {
            background: #f7f9fc;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            color: #2d3748;
        }

        .soap-content textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.6;
            min-height: 100px;
            resize: vertical;
        }

        .soap-content textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* History View */
        .history-timeline {
            margin-top: 30px;
        }

        .history-item {
            border-left: 3px solid #667eea;
            padding-left: 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .history-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 0;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
        }

        .history-date {
            font-size: 14px;
            color: #718096;
            margin-bottom: 10px;
        }

        .history-content {
            background: #f7f9fc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #c6f6d5;
            color: #2f855a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Voice SOAP Notes</h1>
            <p>AI-powered clinical documentation for massage therapy</p>
        </div>

        <div class="main-content">
            <!-- Dashboard View -->
            <div id="dashboardView" class="view active">
                <h2 style="margin-bottom: 20px; color: #2d3748;">Patient Dashboard</h2>

                <div id="addPatientForm" style="display: none;">
                    <div class="input-group">
                        <label>Patient Name</label>
                        <input type="text" id="newPatientName" placeholder="Enter patient name">
                    </div>
                    <button class="btn" onclick="addPatient()">Add Patient</button>
                    <button class="btn btn-secondary" onclick="cancelAddPatient()">Cancel</button>
                </div>

                <div id="patientListContainer">
                    <div class="patient-list" id="patientList">
                        <div class="loading">Loading patients...</div>
                    </div>
                    <button class="btn" onclick="showAddPatientForm()">+ Add New Patient</button>
                </div>
            </div>

            <!-- Patient Detail View -->
            <div id="patientView" class="view">
                <button class="btn btn-back" onclick="showDashboard()">← Back to Dashboard</button>
                <h2 id="patientName" style="margin-bottom: 20px; color: #2d3748;"></h2>
                <button class="btn" onclick="startRecording()">Create New SOAP Note</button>

                <div class="history-timeline" id="patientHistory">
                    <h3 style="margin-top: 40px; margin-bottom: 20px; color: #2d3748;">Visit History</h3>
                    <div class="loading">Loading history...</div>
                </div>
            </div>

            <!-- Recording View -->
            <div id="recordingView" class="view">
                <button class="btn btn-back" onclick="cancelRecording()">← Cancel</button>
                <div class="recording-container">
                    <h2 style="color: #2d3748; margin-bottom: 20px;">Record Your Note</h2>
                    <p class="status-text" id="recordingStatus">Click the button to start recording</p>
                    <div class="timer" id="timer">00:00</div>
                    <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎤</button>
                    <p style="color: #718096; margin-top: 20px;">Speak naturally about the session</p>
                </div>
            </div>

            <!-- SOAP Note View -->
            <div id="soapView" class="view">
                <button class="btn btn-back" onclick="backToPatient()">← Back</button>
                <h2 style="margin-bottom: 30px; color: #2d3748;">SOAP Note</h2>

                <div id="soapContent">
                    <div class="soap-section">
                        <h3>Subjective</h3>
                        <div class="soap-content">
                            <textarea id="subjective"></textarea>
                        </div>
                    </div>

                    <div class="soap-section">
                        <h3>Objective</h3>
                        <div class="soap-content">
                            <textarea id="objective"></textarea>
                        </div>
                    </div>

                    <div class="soap-section">
                        <h3>Assessment</h3>
                        <div class="soap-content">
                            <textarea id="assessment"></textarea>
                        </div>
                    </div>

                    <div class="soap-section">
                        <h3>Plan</h3>
                        <div class="soap-content">
                            <textarea id="plan"></textarea>
                        </div>
                    </div>

                    <button class="btn" onclick="saveSOAPNote()">Save Note</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentPatientId = null;
        let currentSOAPData = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingTimer = null;
        let recordingSeconds = 0;
        const API_BASE = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadPatients();
        });

        // View management
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function showDashboard() {
            showView('dashboardView');
            loadPatients();
        }

        function showPatient(patientId, patientName) {
            currentPatientId = patientId;
            document.getElementById('patientName').textContent = patientName;
            showView('patientView');
            loadPatientHistory(patientId);
        }

        // Patient management
        async function loadPatients() {
            try {
                const response = await fetch(`${API_BASE}/api/patients/`);
                const patients = await response.json();

                const listEl = document.getElementById('patientList');

                if (patients.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <p style="font-size: 18px; margin-bottom: 10px;">No patients yet</p>
                            <p>Add your first patient to get started</p>
                        </div>
                    `;
                    return;
                }

                listEl.innerHTML = patients.map(p => `
                    <div class="patient-card" onclick="showPatient(${p.id}, '${p.name}')">
                        <div class="patient-name">${p.name}</div>
                        <div class="patient-date">Added ${new Date(p.created_at).toLocaleDateString()}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading patients:', error);
                document.getElementById('patientList').innerHTML = `
                    <div class="error">Failed to load patients. Please refresh the page.</div>
                `;
            }
        }

        function showAddPatientForm() {
            document.getElementById('addPatientForm').style.display = 'block';
            document.getElementById('patientListContainer').style.display = 'none';
            document.getElementById('newPatientName').focus();
        }

        function cancelAddPatient() {
            document.getElementById('addPatientForm').style.display = 'none';
            document.getElementById('patientListContainer').style.display = 'block';
            document.getElementById('newPatientName').value = '';
        }

        async function addPatient() {
            const name = document.getElementById('newPatientName').value.trim();
            if (!name) {
                alert('Please enter a patient name');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/patients/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (response.ok) {
                    cancelAddPatient();
                    loadPatients();
                } else {
                    alert('Failed to add patient');
                }
            } catch (error) {
                console.error('Error adding patient:', error);
                alert('Failed to add patient');
            }
        }

        async function loadPatientHistory(patientId) {
            try {
                const response = await fetch(`${API_BASE}/api/soap-notes/patient/${patientId}`);
                const notes = await response.json();

                const historyEl = document.getElementById('patientHistory');

                if (notes.length === 0) {
                    historyEl.innerHTML = `
                        <h3 style="margin-top: 40px; margin-bottom: 20px; color: #2d3748;">Visit History</h3>
                        <div class="empty-state">
                            <p>No notes yet for this patient</p>
                        </div>
                    `;
                    return;
                }

                historyEl.innerHTML = `
                    <h3 style="margin-top: 40px; margin-bottom: 20px; color: #2d3748;">Visit History</h3>
                    ${notes.map(note => `
                        <div class="history-item">
                            <div class="history-date">${new Date(note.date).toLocaleDateString('en-US', {
                                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                            })}</div>
                            <div class="history-content">
                                <p><strong>S:</strong> ${note.subjective}</p>
                                <p style="margin-top: 10px;"><strong>O:</strong> ${note.objective}</p>
                                <p style="margin-top: 10px;"><strong>A:</strong> ${note.assessment}</p>
                                <p style="margin-top: 10px;"><strong>P:</strong> ${note.plan}</p>
                            </div>
                        </div>
                    `).join('')}
                `;
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Recording functions
        function startRecording() {
            showView('recordingView');
            document.getElementById('recordingStatus').textContent = 'Click the button to start recording';
            document.getElementById('timer').textContent = '00:00';
        }

        function cancelRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            if (recordingTimer) {
                clearInterval(recordingTimer);
            }
            showView('patientView');
        }

        function backToPatient() {
            showView('patientView');
        }

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                // Start recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    // Detect supported audio format (for iOS Safari compatibility)
                    let options = { mimeType: 'audio/webm' };
                    if (!MediaRecorder.isTypeSupported('audio/webm')) {
                        if (MediaRecorder.isTypeSupported('audio/mp4')) {
                            options = { mimeType: 'audio/mp4' };
                        } else if (MediaRecorder.isTypeSupported('audio/wav')) {
                            options = { mimeType: 'audio/wav' };
                        } else {
                            options = {}; // Let browser choose
                        }
                    }

                    mediaRecorder = new MediaRecorder(stream, options);
                    audioChunks = [];
                    recordingSeconds = 0;

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        clearInterval(recordingTimer);
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        await processAudio(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    btn.textContent = '⏹️';
                    document.getElementById('recordingStatus').textContent = 'Recording... Click to stop';

                    // Start timer
                    recordingTimer = setInterval(() => {
                        recordingSeconds++;
                        const mins = Math.floor(recordingSeconds / 60);
                        const secs = recordingSeconds % 60;
                        document.getElementById('timer').textContent =
                            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    }, 1000);

                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    alert('Could not access microphone. Please check permissions.');
                }
            } else {
                // Stop recording
                mediaRecorder.stop();
                btn.classList.remove('recording');
                btn.textContent = '🎤';
            }
        }

        async function processAudio(audioBlob) {
            document.getElementById('recordingStatus').textContent = 'Processing audio...';

            try {
                // Determine file extension from MIME type
                let fileExtension = 'webm';
                if (audioBlob.type.includes('mp4')) {
                    fileExtension = 'mp4';
                } else if (audioBlob.type.includes('wav')) {
                    fileExtension = 'wav';
                } else if (audioBlob.type.includes('m4a')) {
                    fileExtension = 'm4a';
                }

                // Transcribe audio
                const formData = new FormData();
                formData.append('file', audioBlob, `recording.${fileExtension}`);

                const transcribeResponse = await fetch(`${API_BASE}/api/soap-notes/transcribe`, {
                    method: 'POST',
                    body: formData
                });

                if (!transcribeResponse.ok) {
                    throw new Error('Transcription failed');
                }

                const transcriptionData = await transcribeResponse.json();
                document.getElementById('recordingStatus').textContent = 'Generating SOAP note...';

                // Generate SOAP note
                const soapResponse = await fetch(`${API_BASE}/api/soap-notes/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcription: transcriptionData.transcription })
                });

                if (!soapResponse.ok) {
                    throw new Error('SOAP generation failed');
                }

                currentSOAPData = await soapResponse.json();

                // Display SOAP note
                document.getElementById('subjective').value = currentSOAPData.subjective;
                document.getElementById('objective').value = currentSOAPData.objective;
                document.getElementById('assessment').value = currentSOAPData.assessment;
                document.getElementById('plan').value = currentSOAPData.plan;

                showView('soapView');

            } catch (error) {
                console.error('Error processing audio:', error);
                alert('Failed to process recording. Please try again.');
                showView('patientView');
            }
        }

        async function saveSOAPNote() {
            try {
                const noteData = {
                    patient_id: currentPatientId,
                    raw_transcription: currentSOAPData.raw_transcription,
                    subjective: document.getElementById('subjective').value,
                    objective: document.getElementById('objective').value,
                    assessment: document.getElementById('assessment').value,
                    plan: document.getElementById('plan').value
                };

                const response = await fetch(`${API_BASE}/api/soap-notes/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(noteData)
                });

                if (response.ok) {
                    showView('patientView');
                    loadPatientHistory(currentPatientId);
                } else {
                    alert('Failed to save note');
                }
            } catch (error) {
                console.error('Error saving note:', error);
                alert('Failed to save note');
            }
        }
    </script>
</body>
</html>
